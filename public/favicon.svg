<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Top Green-to-Cyan Gradient -->
    <linearGradient id="favTopGrad" x1="10%" y1="10%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="45%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Bottom Cyan-to-Blue Gradient -->
    <linearGradient id="favBottomGrad" x1="20%" y1="20%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Inner Fold Depth Gradient -->
    <linearGradient id="favFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="1" />
    </linearGradient>

    <!-- Subtle Highlight -->
    <linearGradient id="favHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00C8FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Background Rounded Container -->
  <rect width="100" height="100" rx="22" fill="#111827" />

  <!-- S-Ribbon Icon with Pixel Matrix -->
  <g transform="translate(6, 6) scale(0.88)" filter="url(#favGlow)">
    <!-- Floating Pixel Matrix on Top-Right -->
    <rect x="74" y="14" width="7" height="7" rx="1.5" fill="#A3E635" />
    <rect x="63" y="16" width="6" height="6" rx="1.5" fill="#22D3EE" />
    <rect x="72" y="24" width="6" height="6" rx="1.5" fill="#06B6D4" />
    <rect x="54" y="22" width="6" height="6" rx="1.5" fill="#38BDF8" />
    <rect x="54" y="31" width="6" height="6" rx="1.5" fill="#00C8FF" />

    <!-- Lower Ribbon Loop (Cyan to Blue tail) -->
    <path
      d="M 44 48
         C 54 44 68 50 72 62
         C 76 74 68 84 56 86
         C 46 88 34 82 24 94
         L 16 96
         C 18 84 26 76 36 72
         C 46 68 56 66 52 56
         C 50 52 46 50 44 48
         Z"
      fill="url(#favBottomGrad)"
    />

    <!-- Main Upper Ribbon Loop (Spring Green to Cyan) -->
    <path
      d="M 52 18
         C 40 18 28 26 22 36
         C 16 46 18 58 28 66
         C 36 72 46 68 52 62
         C 56 58 54 54 48 52
         C 40 50 32 46 34 38
         C 36 30 44 26 52 26
         C 55 26 58 28 60 30
         L 66 22
         C 62 19 57 18 52 18
         Z"
      fill="url(#favTopGrad)"
    />

    <!-- 3D Fold Twist Overlay -->
    <path
      d="M 36 50
         C 42 46 50 46 56 52
         C 60 56 58 64 48 68
         C 42 66 38 58 36 50
         Z"
      fill="url(#favFoldGrad)"
      opacity="0.85"
    />

    <!-- Top Edge Highlight -->
    <path
      d="M 52 18
         C 40 18 28 26 22 36
         C 20 40 20 44 22 48
         C 21 44 22 38 26 34
         C 32 26 42 22 52 22
         L 58 20
         Z"
      fill="url(#favHighlight)"
    />
  </g>
</svg>
